version: '3.8'
services:
  dev-db:
    image: postgres:15
    container_name: nestjs-prisma-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: infoteam
      POSTGRES_PASSWORD: infoteam123
      POSTGRES_DB: mydb
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

volumes:
  pgdata: